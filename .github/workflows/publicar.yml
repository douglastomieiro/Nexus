# Publica uma versão: ao enviar uma tag "v<versão>" (ex.: v0.2.0), gera o instalador do Windows e cria um RASCUNHO de release
# no GitHub com o .exe e o latest.yml (que o app consulta para se atualizar). O rascunho só vale depois de clicar em "Publish".
#
# Configuração única: Settings → Secrets and variables → Actions → aba Variables → New repository variable
#   BROKER_URL = endereço do intermediário de login (ex.: https://<worker>.<subdominio>.workers.dev)
name: Publicar versão

on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a release e enviar os arquivos

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão (tag = package.json)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "A tag $GITHUB_REF_NAME não bate com a versão do package.json ($v)."; exit 1; }

      - run: npm ci

      - name: Endereço do intermediário (app-config.json)
        shell: bash
        env:
          BROKER: ${{ vars.BROKER_URL }}
        run: |
          [ -n "$BROKER" ] || { echo "Defina a variável BROKER_URL (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          printf '{\n  "broker": "%s"\n}\n' "$BROKER" > app-config.json

      - run: npm test

      # Cria o rascunho ANTES de enviar os arquivos: sem isso, os envios em paralelo criavam um rascunho cada (v0.2.0 saiu em dois).
      - name: Criar o rascunho da release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "Versão ${GITHUB_REF_NAME#v}"

      - name: Gerar instalador e enviar para a release (rascunho)
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
