<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="vendor/chart.umd.js"></script>
<script src="tema.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--panel2:#f3f6fc;--bd:#e4e9f2;--tx:#1e293b;--mut:#64748b;--ac:#2563eb;--ac2:#eaf0ff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--l1:#2563eb;--l2:#ea580c;--tx1:#0f172a;--tx2:#334155;--tx3:#475569;--mut2:#94a3b8;--soft:#f8fafc;--row:#f8faff;--hov:#f1f5f9;--chip:#eef2f7;--line:#eef1f6;--line2:#e2e8f0;--off:#cbd5e1;--inbd:#d9dfeb;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.45 Inter,system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--off);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ── sidebar ── */
nav{width:60px;background:var(--panel);border-right:1px solid var(--bd);padding:18px 10px;position:fixed;left:0;top:0;height:100vh;z-index:20;display:flex;flex-direction:column;overflow:hidden;white-space:nowrap;transition:width .2s ease,box-shadow .2s ease}
nav:hover{width:232px;padding:18px 12px;box-shadow:12px 0 32px rgba(15,23,42,.16);overflow:auto}
body.pin nav{width:232px;padding:18px 12px;box-shadow:none;overflow:auto}
nav:not(:hover) .user,nav:not(:hover) .pinsw,nav:not(:hover) .foot{opacity:0;pointer-events:none}
body.pin nav .user,body.pin nav .pinsw,body.pin nav .foot{opacity:1;pointer-events:auto}
nav .user,nav .pinsw,nav .foot{transition:opacity .15s}
nav a span,nav .brand span,nav a .tag{transition:opacity .12s}
body:not(.pin) nav:not(:hover) a span,body:not(.pin) nav:not(:hover) .brand span,body:not(.pin) nav:not(:hover) a .tag{opacity:0}
body:not(.pin) nav:not(:hover) .user,body:not(.pin) nav:not(:hover) .pinsw,body:not(.pin) nav:not(:hover) .foot{opacity:0}
body.pin main{margin-left:232px}
main{margin-left:60px;transition:margin-left .2s ease}
.pinsw{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--tx3);cursor:pointer;user-select:none}
.pinsw input{display:none}.pinsw .sw{margin-left:auto;width:30px;height:17px;border-radius:99px;background:var(--off);position:relative;transition:background .15s;flex-shrink:0}
.pinsw .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.pinsw input:checked+.sw{background:var(--ac)}.pinsw input:checked+.sw::after{transform:translateX(13px)}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--tx1)}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:grid;place-items:center;font:700 13px Inter,sans-serif;font-style:normal;letter-spacing:0}
.brand small{font-weight:500;color:var(--mut);font-size:18px}
.user{display:flex;align-items:center;gap:10px;margin:0 4px 14px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--soft)}
.user b{width:32px;height:32px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:12px}
.user span{display:block;font-weight:600;font-size:12.5px;line-height:1.2}.user small{color:var(--mut);font-size:11px}
#menu{flex:1}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:1px 0;border-radius:8px;color:var(--tx3);cursor:pointer;font-weight:500;font-size:13px;text-decoration:none}
nav a svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
nav a:hover{background:var(--hov);color:var(--tx1)}
nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
nav a .tag{margin-left:auto;padding:0 7px;font-size:11px;line-height:18px}
.sep{height:1px;background:var(--bd);margin:8px 6px}
.foot{padding:12px 6px 0;font-size:11px;color:var(--mut);border-top:1px solid var(--bd);margin-top:8px}
.foot>b{display:block;letter-spacing:.07em;font-size:10px;margin:0 4px 6px}
.vr{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:8px}.vr:hover{background:var(--hov)}
.vr i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vr div{min-width:0;flex:1}.vr span{display:block;color:var(--tx2);font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr small{color:var(--mut);font-size:10.5px}.vr em{font-style:normal;font-weight:600;color:var(--tx1);font-size:11.5px;white-space:nowrap}

/* ── cabeçalho / filtros ── */
main{flex:1;padding:18px 26px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.ph .ico{width:34px;height:34px;border-radius:10px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;flex-shrink:0}
.ph .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ph h2{margin:0;font-size:15px;font-weight:700;line-height:1.2}.ph small{color:var(--mut);font-size:11.5px}
.ph .tx{flex:1;min-width:0}
.ph .st{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;cursor:help;white-space:nowrap}.ph .st i{width:7px;height:7px;border-radius:50%;background:var(--off);display:inline-block}.ph .st.velho{background:#fff5f5;border-color:#fecaca;color:#b91c1c}
.fnota{color:var(--mut);font-size:11.5px;align-self:center}
.flt{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 16px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.flt h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.flt .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.flt label{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;min-width:170px}
.flt label select{text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx)}

/* ── sub-abas ── */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 14px;padding:4px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);width:fit-content;max-width:100%}
.tabs:empty{display:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;color:var(--tx3);font-weight:500;font-size:12.5px;text-decoration:none;white-space:nowrap}
.tabs a svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a:hover{background:var(--hov);color:var(--tx1)}
.tabs a.on{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(37,99,235,.3)}

/* ── DRE (estilo Jodda): meses em colunas, seções escuras ── */
.tw.dre{max-height:none;border:1px solid var(--bd);border-radius:10px}
#tdre{font-size:12px;border-collapse:separate;border-spacing:0;min-width:900px}
#tdre th{background:#0f172a;color:#e2e8f0;border-bottom:0;padding:10px 12px;position:sticky;top:0;cursor:default;z-index:2}
#tdre th:hover{color:#e2e8f0}
#tdre td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
#tdre td.lb,#tdre th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:250px;font-weight:500;border-right:1px solid var(--bd)}
#tdre.cmp td{padding:8px 6px}#tdre.cmp th{padding:10px 6px}#tdre.cmp td.lb,#tdre.cmp th:first-child{min-width:200px;max-width:220px;white-space:normal} /* DRE compacto: muitos meses */
/* DRE › Imprimir / PDF: só a caixa do DRE, sem menu, filtros e o resto da tela */
.so-imp{display:none}
@media print{body.imp-dre nav,body.imp-dre .ph,body.imp-dre .tabs,body.imp-dre .flt,body.imp-dre #view>:not(.dre-imp){display:none!important}body.imp-dre main{margin:0!important;padding:0!important}body.imp-dre .tw{max-height:none!important;overflow:visible!important}body.imp-dre .dre-imp{border:0!important;box-shadow:none!important}body.imp-dre .dre-imp button{display:none!important}body.imp-dre .so-imp{display:block}body.imp-dre #tdre{font-size:10px}@page{size:landscape;margin:10mm}}
#tdre th:first-child{background:#0f172a;z-index:3;border-right:0}
#tdre tr.sec td{background:#0f172a;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.08em;padding:7px 12px;position:static}
#tdre tr.sub td{background:#eef4ff;font-weight:700;color:#1e3a8a}#tdre tr.sub td.lb{background:#eef4ff}
#tdre tr.tot td{background:#fef9c3;font-weight:700;color:#713f12;border-top:1px solid #fde047;border-bottom:1px solid #fde047}#tdre tr.tot td.lb{background:#fef9c3}
#tdre tr.eq td{background:var(--soft);color:var(--mut)}#tdre tr.eq td.lb{background:var(--soft)}
#tdre td:last-child{border-left:1px solid var(--bd);font-weight:600}
#tdre tbody tr:not(.sec):hover td{background:var(--row)}#tdre tr.sub:hover td,#tdre tr.tot:hover td{filter:brightness(.98)}

/* ── controles ── */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
select,input:not([type=checkbox]):not([type=radio]),textarea{background:var(--panel);color:var(--tx);border:1px solid var(--inbd);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;outline:none;transition:border-color .12s,box-shadow .12s}
select:focus,input:focus,textarea:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #2563eb1f}
input[type=checkbox],input[type=radio]{accent-color:var(--ac)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:600 13px Inter,sans-serif;cursor:pointer;transition:filter .12s}
button:hover{filter:brightness(1.08)}
.btn-ref{display:inline-flex;align-items:center;gap:6px}

#view>.bar{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
#view>.bar input:not([type=checkbox]){min-width:200px}
#view>.bar label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px}
.box>.bar{margin-bottom:12px}
.box td img{box-shadow:0 0 0 1px var(--bd)}
.box>p{color:var(--mut)}

/* ── cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card,.box{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.cards .card{border-top:3px solid #3b82f6}
.cards .card:nth-child(5n+2){border-top-color:#f59e0b}.cards .card:nth-child(5n+3){border-top-color:#8b5cf6}
.cards .card:nth-child(5n+4){border-top-color:#22c55e}.cards .card:nth-child(5n+5){border-top-color:#ef4444}
.card .l{color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.045em;text-transform:uppercase}
.card .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.02em;color:var(--tx1)}
.card .v.ok{color:var(--ok)}.card .v.bad{color:var(--bad)}.card .v.warn{color:var(--warn)}
.card.cl{cursor:pointer;transition:.15s}.card.cl:hover{box-shadow:0 4px 14px rgba(37,99,235,.14);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.box h3{margin:0 0 12px;font-size:13.5px;color:var(--tx1);font-weight:700}.box h3 small{font-weight:400;color:var(--mut)}

/* ── tabelas ── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:normal;min-width:64px;z-index:1}
th:hover{color:var(--ac)}
tbody tr:hover td{background:var(--row)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tw{max-height:560px;overflow:auto;border-radius:8px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--chip);color:var(--tx3)}
.tag.ok{background:#dcfce7;color:#15803d}.tag.bad{background:#fee2e2;color:#b91c1c}.tag.warn{background:#fef3c7;color:#b45309}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
a.lk{color:var(--l1);text-decoration:none}a.lk:hover{text-decoration:underline}
code{background:#eef2ff;color:#3730a3;padding:1px 5px;border-radius:4px;font-size:12px}
pre{background:var(--hov);color:var(--tx);padding:12px;border-radius:8px;overflow:auto;max-height:600px;font-size:12px}
details summary{cursor:pointer}hr{border:0;border-top:1px solid var(--bd)}

/* ── painel lateral ── */
#dw{position:fixed;top:0;right:0;width:min(660px,100%);height:100vh;background:var(--panel);border-left:1px solid var(--bd);box-shadow:-12px 0 40px rgba(15,23,42,.14);transform:translateX(105%);transition:.2s;z-index:9;display:flex;flex-direction:column}
#dw.on{transform:none}#dw header{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:15px}
#dw .bd{overflow:auto;padding:14px 18px;flex:1}#dw details{margin-bottom:8px}#dw summary{color:var(--ac);padding:4px 0;font-weight:500}#dw pre{max-height:none}
#dw .exp{background:var(--row);border:1px solid #e3eaff;border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;margin:0 0 10px}
#dw .exp b.h{display:block;color:var(--ac);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

@media(max-width:860px){body{flex-direction:column}main,body.pin main{margin-left:0}nav,body.pin nav,nav:hover{width:auto;height:auto;position:static;flex-direction:column;overflow:visible;box-shadow:none}.pinsw{display:none}#menu{display:flex;flex-wrap:wrap;gap:4px}.sep,.foot,.user{display:none}.grid{grid-template-columns:1fr}main{padding:14px}}
</style>
<link rel="stylesheet" href="jodda.css">
<link rel="stylesheet" href="tema.css">
</head>
<body>
<nav>
  <div class="brand"><img src="logo.svg" alt="" width="30" height="30"><span>Nexus</span></div>
  <div class="user"><b id="uav">ML</b><div><span>Mercado Livre</span><small id="usub">Lucro real por pedido</small></div></div>
  <label class="pinsw" title="Mantém o menu sempre visível"><span>Fixar menu</span><input type="checkbox" id="pinmenu"><span class="sw"></span></label>
  <div id="menu"></div>
  <div class="foot"><b>VENDAS RECENTES</b><div id="vrec"><small>carregando…</small></div></div>
</nav>
<main>
  <div class="ph"><div class="ico" id="hico"></div><div class="tx"><h2 id="titulo"></h2><small id="sub"></small></div><div class="st" id="coleta" title=""><i id="sti"></i><span id="stxt">verificando coleta…</span></div></div>
  <div id="tabs" class="tabs"></div>
  <div class="flt"><h4><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>Filtros</h4>
    <div class="row">
      <label>Loja<select id="loja"><option value="all">Todas as lojas</option></select></label>
      <label id="fper">Período<select id="dias"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option><option value="180">180 dias</option><option value="365">12 meses</option></select></label>
      <button id="atualiza" class="btn-ref"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Atualizar</button>
      <span id="fnota" class="fnota"></span>
    </div>
  </div>
  <div id="view"></div>
</main>
<div id="dw"><header><b id="dt"></b><a class="lk" href="#" onclick="fecha();return false">fechar ✕</a></header><div class="bd" id="db"></div></div>
<script>
const $ = s => document.querySelector(s);
(() => { const c = $('#pinmenu'); let p = false;
  try { p = localStorage.getItem('menuFixo') === '1'; } catch {}
  c.checked = p; document.body.classList.toggle('pin', p);
  c.addEventListener('change', () => { document.body.classList.toggle('pin', c.checked); try { localStorage.setItem('menuFixo', c.checked ? '1' : '0'); } catch {} });
})();
const brl = n => (n ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = n => (n ?? 0).toLocaleString('pt-BR');
const dt = s => s ? new Date(s).toLocaleString('pt-BR') : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Cor de loja<n> = n-ésima da paleta (as lojas vêm do .env: TOKENS_LOJA<n>)
const PAL_LOJA = ['#4da3ff', '#ff8a4d', '#22c55e', '#a855f7', '#eab308', '#ec4899', '#14b8a6', '#64748b'];
const COR = new Proxy({}, { get: (_, l) => PAL_LOJA[(parseInt(String(l).replace('loja', '')) - 1) % PAL_LOJA.length] });
let LOJAS = {}, charts = [];
// Link que abre o painel lateral com o detalhe AO VIVO da API (sob demanda)
// Clique no ID → abre a página no Mercado Livre (nova aba). O pequeno "{ }" ao lado abre o retorno bruto da API (para conferência técnica).
// `go` = id do pedido usado na página do ML quando o registro é envio ou reclamação (eles são vistos dentro do pedido).
const mlUrl = (t, i, go) => ({
  order: `https://www.mercadolivre.com.br/vendas/${i}/detalhe`,
  shipment: go ? `https://www.mercadolivre.com.br/vendas/${go}/detalhe` : null,
  claim: go ? `https://www.mercadolivre.com.br/vendas/${go}/detalhe` : null,
  item: `https://produto.mercadolivre.com.br/MLB-${String(i).replace(/\D/g, '')}-_JM`,
  pack: `https://www.mercadolivre.com.br/vendas/${i}/detalhe`,
}[t]);
const lv = (t, i, l, go) => { if (!i) return ''; const u = mlUrl(t, i, go);
  return `${u ? `<a class="lk" target="_blank" rel="noopener" href="${u}" title="Abrir no Mercado Livre">${i}</a>` : esc(i)} <a class="lk lv" href="#" data-t="${t}" data-i="${i}" data-l="${l}" title="Ver retorno da API" style="color:var(--mut);font-size:11px">{ }</a>`; };
const fecha = () => $('#dw').classList.remove('on');
document.addEventListener('click', async e => {
  const a = e.target.closest('a.lv'); if (!a) return; e.preventDefault();
  $('#dt').textContent = `${a.dataset.t} ${a.dataset.i} · ${LOJAS[a.dataset.l]}`;
  $('#db').innerHTML = '<p style="color:var(--mut)">Consultando a API do ML…</p>'; $('#dw').classList.add('on');
  const d = await fetch(`api/live?tipo=${a.dataset.t}&id=${a.dataset.i}&loja=${a.dataset.l}`).then(r => r.json());
  $('#db').innerHTML = Object.entries(d).map(([k, v], n) => `<details ${n < 2 ? 'open' : ''}><summary>${esc(k)}${v?._status ? ` <span class="bad">(${v._status})</span>` : ''}</summary><pre>${esc(JSON.stringify(v, null, 2))}</pre></details>`).join('');
});
const qs = () => `loja=${$('#loja').value}&dias=${$('#dias').value}`;
// NAV muda a cada troca de tela: a resposta de uma tela antiga é descartada (antes ela podia sobrescrever a tela nova)
let NAV = 0; const STALE = { stale: true };
const getJ = url => { const id = NAV; return fetch(url).then(async r => { const j = await r.json().catch(() => ({ erro: `resposta inválida do servidor (HTTP ${r.status})` })); if (id !== NAV) throw STALE; if (!r.ok || (j && j.erro && !Array.isArray(j))) throw new Error(j.erro || `HTTP ${r.status}`); return j; }); };
const api = (p, extra = '') => getJ(`api/${p}${p.includes('?') ? '&' : '?'}${qs()}${extra}`);
const mk = (id, cfg) => { const el = $(id); if (!el) return null; const c = new Chart(el, temaGraf(cfg)); charts.push(c); return c; };
Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.font.size = 11.5; Chart.defaults.color = '#64748b'; Chart.defaults.elements.bar.borderRadius = 4;

const pct = n => ((n || 0) * 100).toFixed(1).replace('.', ',') + '%';

const pill = (txt, cls) => `<span class="tag ${cls}">${txt}</span>`;

const corL = n => n < 0 ? 'bad' : '';
// grava custo unitário de um SKU (campo editável)

// senão filtrar ou buscar de novo redesenha a lista antiga e o campo volta vazio (parecia que não tinha salvo).
let CUSTOS_TELA = null;

const custoDesde = () => { const vg = document.getElementById('cvig'); return !vg || vg.value === 'hoje' ? undefined : vg.value === 'sempre' ? '0000-00-00' : $('#cvd').value || undefined; };
// servidor com vigência do custo (depois de reiniciado): só então a tela pergunta "correção ou mudança"

// Resolve 'sempre', 'hoje' ou null (cancelou: Esc ou Cancelar).
function perguntaVigencia(el, titulo) {
  return new Promise(fim0 => {
    document.getElementById('pvig')?.remove();
    const b = el.getBoundingClientRect(), d = document.createElement('div'); d.id = 'pvig';

    d.innerHTML = `<b>${titulo}</b><p style="margin:6px 0 10px;color:var(--mut)">É uma <b>correção</b> (o valor antigo estava errado: refaz o lucro de todo o período) ou o custo do produto <b>mudou agora</b> (os pedidos antigos continuam com o custo antigo)?</p>
      <div style="display:flex;flex-direction:column;gap:6px"><button data-r="sempre">Correção: vale para todo o período</button><button data-r="hoje" style="background:var(--panel);color:var(--ac);border:1px solid var(--bd)">Mudou agora: vale a partir de hoje</button><button data-r="" style="background:none;color:var(--mut);padding:4px">Cancelar</button></div>`;
    const esc = e => { if (e.key === 'Escape') fim(null); };
    const fim = r => { d.remove(); removeEventListener('keydown', esc, true); fim0(r); };
    d.onclick = e => { const t = e.target.closest('button'); if (t) fim(t.dataset.r || null); };

  });
}
async function salvaCusto(inp) {
  let v = inp.value.trim(); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); // 1.234,56 → 1234.56
  let desde = custoDesde();

  const antes = inp.defaultValue.trim();
  if (desde === undefined && window.VIGENCIA_OK && v !== '' && antes !== '' && Number.isFinite(+v) && +antes !== +v) {
    const r0 = await perguntaVigencia(inp, `O custo mudou de ${brl(+antes)} para ${brl(+v)}.`);
    if (!r0) { inp.value = inp.defaultValue; return; }
    desde = r0 === 'sempre' ? '0000-00-00' : new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); // escolha explícita: hoje cria (ou troca) o custo de hoje
  }

  const r = await fetch('api/custos', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sku: inp.dataset.sku, custo: v === '' ? null : v, desde }) }).catch(() => null);

}

function backupWeb() {
  const box = document.createElement('div'); box.className = 'box'; box.style.cssText = 'max-width:760px;margin-top:14px';
  box.innerHTML = `<h3>Backup dos custos</h3><p style="color:var(--mut)">Seus custos dos produtos, custos fixos e alíquotas existem <b>só neste navegador</b>. Se você limpar os dados do site ou trocar de computador, eles somem — o resto (pedidos etc.) volta sozinho do Mercado Livre. Baixe uma cópia de vez em quando.</p>
    <button id="bkx" style="background:var(--ac);border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer">Baixar backup</button>
    <label style="margin-left:10px;cursor:pointer;text-decoration:underline">Restaurar de um arquivo… <input id="bki" type="file" accept=".json,application/json" style="display:none"></label> <span id="bkm"></span>`;
  $('#view').appendChild(box);
  $('#bkx').onclick = async () => {
    const d = await fetch('api/backup').then(r => r.json());
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
    a.download = 'nexus-custos-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#bki').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    let arquivo; try { arquivo = JSON.parse(await f.text()); } catch { $('#bkm').textContent = 'Arquivo inválido.'; return; }
    if (!confirm('Restaurar este backup? Os custos e alíquotas atuais serão substituídos pelos do arquivo.')) return;
    const r = await fetch('api/backup/restaurar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ arquivo }) }), j = await r.json();
    $('#bkm').textContent = r.ok ? `✓ ${j.restaurado} custos restaurados.` : (j.erro || 'Não foi possível restaurar.');
  };
}

const badge = k => k === 'alertas' && window.NALERTA ? ` <span class="tag" style="background:var(--bad);color:#fff;padding:0 7px">${window.NALERTA}</span>` : '';
// status da coleta: a de pedidos roda a cada 5 min pelo servidor; se parar (servidor desligado ou token vencido), o painel avisa
async function statusColeta() {
  try {
    const s = await fetch('api/status').then(r => r.json()), ult = Math.max(0, ...Object.values(s.pedidos || {}));
    const min = ult ? Math.round((s.agora - ult) / 6e4) : null;
    const txt = min == null ? 'coleta ainda não executada' : min < 60 ? `há ${min} min` : min < 1440 ? `há ${Math.floor(min / 60)} h` : `há ${Math.floor(min / 1440)} dia(s)`;
    $('#stxt').textContent = 'Pedidos sincronizados ' + txt; $('#sti').style.background = min != null && min <= 20 ? 'var(--ok)' : min != null && min <= 120 ? 'var(--warn)' : 'var(--bad)';
    $('#coleta').title = 'A coleta de pedidos roda a cada 5 minutos. Se o horário ficar antigo, confira se o Nexus está ligado e se os tokens estão sendo renovados.';
    $('#coleta').classList.toggle('velho', !(min != null && min <= 120));
  } catch { $('#stxt').textContent = 'status da coleta indisponível'; }
}
async function vendasRecentes() {
  try {
    const r = (await fetch('api/pedidos?loja=all&dias=7&limit=40').then(x => x.json())).filter(x => x.status !== 'cancelled').slice(0, 6);
    const ago = d => { const m = Math.max(0, Math.round((Date.now() - new Date(d)) / 6e4)); return m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + ' h' : Math.floor(m / 1440) + ' d'; };
    $('#vrec').innerHTML = r.length ? r.map(x => `<div class="vr" title="${esc(x.itens)}"><i style="background:${COR[x.loja] || '#94a3b8'}"></i><div><span>${esc((x.itens || '').split(' | ')[0].replace(/ x\d+$/, ''))}</span><small>${esc(LOJAS[x.loja] || x.loja)} · há ${ago(x.data)}</small></div><em>${brl(x.total)}</em></div>`).join('') : '<small>sem vendas nos últimos 7 dias</small>';
  } catch { $('#vrec').innerHTML = '<small>indisponível</small>'; }
}
function montaMenu() {
  $('#menu').innerHTML = GRUPOS.map(g => `<a data-g="${g.n}" href="#${g.tabs[0][0]}">${svgIco(g.ico)}<span>${esc(g.n)}</span></a>`).join('');
}
function montaAbas(v) {
  const g = grupoDe(v);
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('on', a.dataset.g === g?.n));
  $('#tabs').innerHTML = g && g.tabs.length > 1 ? g.tabs.map(([k, t]) => `<a href="#${k}" class="${k === v ? 'on' : ''}">${svgIco(k)}${esc(t)}${badge(k)}</a>`).join('') : '';
}
// O filtro de período só vale para algumas telas; nas outras aparece só a loja e uma nota com a janela usada
const PERIODO = { lucro: 1, visao: 1, pedidos: 1, abc: 1, sku: 1, devolucoes: 1, catalogo: 1 }, SEM_FILTRO = { config: 1, calculadora: 1 };
const NOTA = { dre: 'Período escolhido na própria tela: últimos meses, ano, um mês, intervalo ou meses escolhidos', indicadores: 'Período fixo: últimos 6 meses', ads: 'Período fixo: últimos 90 dias (Product Ads)', campanhas: 'Período fixo: últimos 90 dias (Product Ads)', anunciosads: 'Período fixo: últimos 90 dias (Product Ads)', custos: 'Período escolhido na própria tela', itens: 'Situação atual dos anúncios', estoque: 'Estoque atual · vendas dos últimos 90 dias', alertas: 'Situação atual', reputacao: 'Métricas do ML (últimos 60 dias)', atendimento: 'Perguntas e reclamações mais recentes', envios: 'Todos os envios coletados', promocoes: 'Promoções vigentes', cobertura: 'Todo o histórico coletado', raw: 'Dados crus coletados' };
async function go() {
  const id = ++NAV, [v, arg] = (location.hash.slice(1) || 'lucro').split(':'); charts.forEach(c => c.destroy()); charts = [];
  if (!VIEWS[v]) { location.hash = 'lucro'; return; }
  $('.flt').style.display = SEM_FILTRO[v] ? 'none' : ''; $('#fper').style.display = PERIODO[v] ? '' : 'none'; $('#fnota').textContent = PERIODO[v] ? '' : (NOTA[v] || '');
  montaAbas(v);
  $('#titulo').textContent = grupoDe(v)?.n || ''; $('#sub').textContent = SUB[v] || ''; $('#hico').innerHTML = svgIco(grupoDe(v)?.ico || v);
  $('#view').innerHTML = '<p style="color:var(--mut)">Carregando…</p>';
  try { await VIEWS[v](arg && decodeURIComponent(arg)); } catch (e) { if (e === STALE || id !== NAV) return; console.error(e); $('#view').innerHTML = `<div class="box" style="border-color:#fecaca;background:#fff5f5"><b class="bad">Não foi possível carregar esta tela.</b><p style="margin:6px 0 0;color:var(--mut)">${esc(e.message)}</p></div>`; }
}
document.addEventListener('DOMContentLoaded', async () => { // espera extra.js e jodda.js (que ajustam menu e telas)
  LOJAS = await fetch('api/lojas').then(r => r.json());
  Object.entries(LOJAS).forEach(([k, n]) => $('#loja').insertAdjacentHTML('beforeend', `<option value="${k}">${n}</option>`));
  vendasRecentes(); setInterval(vendasRecentes, 300000); statusColeta(); setInterval(statusColeta, 60000);
  $('#usub').textContent = `${Object.keys(LOJAS).length} loja(s) conectada(s)`;
  montaMenu();
  $('#loja').onchange = $('#dias').onchange = $('#atualiza').onclick = go; window.onhashchange = go; go();
});
</script>
